[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-estate-manager"
version = "0.1.0"
description = "AI-powered digital asset discovery and post-mortem executor platform"
authors = [{ name = "Hackathon Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.57",
    "pandas>=2.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "ddgs>=9.0",
    # Cancellation engine (backend/) used by the cancellation guide
    "fpdf2>=2.7",
    "openai>=1.30",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",

]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "pytest>=7"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
subscription-finder = "subscription_finder.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"