[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-estate-manager"
version = "0.1.0"
description = "AI-powered digital asset discovery and post-mortem executor platform"
authors = [{ name = "Hackathon Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35.0",
    "pandas>=2.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "ddgs>=9.0",
    # Also required, installed from the local folder (not from PyPI):
    #   pip install -e ./subscription_finder
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "pytest"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"